{% extends "base.html" %}
{% block content %}

<div class="card">
    <p style="color: #888; font-size: 14px;">Question {{ question_number }} of 7</p>
    <h3 style="color: #2c3e50; margin: 15px 0;">{{ question.question }}</h3>
    
    <form method="POST">
        <label>Your Answer</label>
        <textarea name="answer" rows="6" placeholder="Type your answer here..." required></textarea>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Submit Answer</button>
    </form>
</div>

{% endblock %}
